name: ESPB host-side test tools
# Re-run host-side validation for the refreshed paired task corpus.

on:
  push:
    branches:
      - ESPB_WORK
    paths:
      - "tools/bytecode_groups/**"
      - "tests/host_tools/**"
      - ".github/workflows/espb-host-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: espb-host-tests
  cancel-in-progress: false

jobs:
  host-tests:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout ESPB_WORK
        uses: actions/checkout@v4
        with:
          ref: ESPB_WORK
          fetch-depth: 0

      - name: Run fast host-side unit tests
        run: python -m unittest discover -s tests/host_tools -p "test_*.py" -v

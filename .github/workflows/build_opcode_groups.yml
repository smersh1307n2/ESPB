name: Build ESPB opcode-group bitcode

on:
  push:
    branches:
      - ESPB_WORK
    paths:
      - 'tests/bytecode_groups/**'
      - 'tools/bytecode_groups/**'
      - '.github/workflows/build_opcode_groups.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    container:
      image: espressif/idf:v5.4.1
    steps:
      - name: Checkout ESPB_WORK and translator source project
        uses: actions/checkout@v4
        with:
          ref: ESPB_WORK
          submodules: recursive
          fetch-depth: 0

      - name: Install ESP Clang
        shell: bash
        run: |
          python "$IDF_PATH/tools/idf_tools.py" install esp-clang
          CLANG="$(find -L /opt/esp/tools/esp-clang -type f -path "*/bin/clang" -perm -111 -print -quit)"
          test -n "$CLANG"
          echo "$(dirname "$CLANG")" >> "$GITHUB_PATH"
          echo "ESPB_CLANG=$CLANG" >> "$GITHUB_ENV"

      - name: Build each opcode group as a separate LLVM bitcode module
        shell: bash
        run: |
          set -euo pipefail
          . "$IDF_PATH/export.sh"
          python tools/bytecode_groups/build.py --output-dir "$GITHUB_WORKSPACE/.work/bytecode_groups"
          test "$(find .work/bytecode_groups -maxdepth 1 -name '*.bc' -type f | wc -l)" -eq 10

      - name: Upload LLVM bitcode modules
        uses: actions/upload-artifact@v4
        with:
          name: espb-opcode-groups-bc
          path: .work/bytecode_groups/*.bc
          if-no-files-found: error
          retention-days: 14

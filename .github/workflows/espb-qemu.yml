name: ESPB QEMU smoke tests

on:
  push:
    branches:
      - experiment/qemu-esp32-runtime-tests
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qemu-smoke:
    name: QEMU / ${{ matrix.target }}
    runs-on: ubuntu-22.04
    container:
      image: espressif/idf:v5.4.1
    strategy:
      fail-fast: false
      matrix:
        target:
          - esp32
          - esp32c3

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Espressif QEMU
        shell: bash
        run: |
          python "$IDF_PATH/tools/idf_tools.py" install qemu-xtensa qemu-riscv32
          . "$IDF_PATH/export.sh"
          qemu-system-xtensa --version
          qemu-system-riscv32 --version

      - name: Build ESPB firmware
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          idf.py set-target "${{ matrix.target }}"
          idf.py build

      - name: Run ESPB firmware in QEMU
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          set +e
          timeout --signal=INT --kill-after=5s 45s idf.py qemu > qemu.log 2>&1
          qemu_status=$?
          set -e
          cat qemu.log

          # The demo firmware is expected to keep the FreeRTOS scheduler alive.
          # A timeout is therefore normal; the UART completion marker is the test.
          if [ "$qemu_status" -ne 0 ] && [ "$qemu_status" -ne 124 ] && [ "$qemu_status" -ne 130 ]; then
            echo "QEMU exited unexpectedly: $qemu_status"
            exit "$qemu_status"
          fi

          if grep -F -- "Failed to call" qemu.log; then
            echo "ESPB API call failed"
            exit 1
          fi
          grep -F -- "Result is CORRECT." qemu.log
          grep -F -- "--- ESPB API Demo Finished ---" qemu.log
          # Require five numeric samples and one numeric median; a completion
          # marker alone must not turn an incomplete benchmark into a pass.
          for sample in 0 1 2 3 4; do
            if ! grep -Eq "\\[ESPB_BENCH\\] sample_${sample}_us=[1-9][0-9]* cycles_start=[0-9]+ cycles_end=[0-9]+ cycles_delta=[1-9][0-9]*$" qemu.log; then
              echo "Missing or invalid benchmark sample ${sample}"
              exit 1
            fi
          done
          median_count=$(grep -Ec "\\[ESPB_BENCH\\] app_main_median_us=[1-9][0-9]*([[:space:]]|$)" qemu.log || true)
          if [ "$median_count" -ne 1 ]; then
            echo "Expected exactly one numeric microsecond median, found $median_count"
            exit 1
          fi
          cycle_median_count=$(grep -Ec "\\[ESPB_BENCH\\] app_main_median_cycles=[1-9][0-9]*$" qemu.log || true)
          if [ "$cycle_median_count" -ne 1 ]; then
            echo "Expected exactly one numeric cycle median, found $cycle_median_count"
            exit 1
          fi

# Push-triggered smoke test; kept isolated on the experiment branch.

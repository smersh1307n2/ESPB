name: Build paired ESPB opcode-group modules
# Rebuild the second-stage diagnostics for signed shifts and helper-call preservation.
# Incremental retry after artifact-path normalization; unchanged pairs stay quota-free.
# Fresh diagnostic source groups: switch isolation, conversion trace, atomic sub-results.
# Rebuild after removing diagnostic printf from the timed atomic path.
# Re-translate task lifecycle test and per-module callback ownership changes.
# FreeRTOS fixtures use nonzero timer ticks and ESP-IDF byte-sized task stacks.
# Reuse prior JIT/Interpreter pairs by exact LLVM bitcode SHA; only changed
# bitcode groups are submitted to the quota-limited translator API.
# Persist the verified paired corpus into modules/qemu_seed after translation.
# Retry only bitcode groups whose SHA differs from the last verified paired artifact.
# [translate-opcode-corpus] Build/publish paired hot and non-hot JIT/interpreter modules.

on:
  # Quota-consuming push execution is opt-in via a commit-message marker.
  # Ordinary corpus and runtime commits never auto-call the translator.
  push:
    branches:
      - ESPB_WORK
    paths:
      - ".github/workflows/build_opcode_groups_espb.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: espb-opcode-group-translation
  cancel-in-progress: false

jobs:
  translate:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[translate-opcode-corpus]')) }}
    runs-on: ubuntu-22.04
    container:
      image: espressif/idf:v5.4.1
    steps:
      - name: Check translator credentials
        env:
          ESPB_TRANSLATOR_KEYS: ${{ secrets.ESPB_TRANSLATOR_KEYS }}
          ESPB_API_KEY: ${{ secrets.ESPB_API_KEY }}
          ESPB_API_KEY_1: ${{ secrets.ESPB_API_KEY_1 }}
          ESPB_API_KEY_2: ${{ secrets.ESPB_API_KEY_2 }}
          ESPB_API_KEY_3: ${{ secrets.ESPB_API_KEY_3 }}
          ESPB_API_KEY_4: ${{ secrets.ESPB_API_KEY_4 }}
          ESPB_API_KEY_5: ${{ secrets.ESPB_API_KEY_5 }}
          ESPB_API_KEY_6: ${{ secrets.ESPB_API_KEY_6 }}
          ESPB_API_KEY_7: ${{ secrets.ESPB_API_KEY_7 }}
          ESPB_API_KEY_8: ${{ secrets.ESPB_API_KEY_8 }}
          ESPB_API_KEY_9: ${{ secrets.ESPB_API_KEY_9 }}
          ESPB_API_KEY_11: ${{ secrets.ESPB_API_KEY_11 }}
          ESPB_API_KEY_10: ${{ secrets.ESPB_API_KEY_10 }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$ESPB_TRANSLATOR_KEYS" && -z "$ESPB_API_KEY" && -z "$ESPB_API_KEY_1" && -z "$ESPB_API_KEY_2" && -z "$ESPB_API_KEY_3" && -z "$ESPB_API_KEY_4" && -z "$ESPB_API_KEY_5" && -z "$ESPB_API_KEY_6" && -z "$ESPB_API_KEY_7" && -z "$ESPB_API_KEY_8" && -z "$ESPB_API_KEY_9" && -z "$ESPB_API_KEY_10" && -z "$ESPB_API_KEY_11" ]]; then
            echo "::error::No translator credentials configured."
            exit 1
          fi

      - name: Checkout ESPB_WORK and translator source project
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          submodules: recursive
          fetch-depth: 0

      - name: Run fast host-side unit tests
        run: python -m unittest discover -s tests/host_tools -p "test_*.py" -v

      - name: Select compatible bitcode and previous paired artifacts
        id: bitcode
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXPECTED_SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$GITHUB_WORKSPACE/projects/ESP32_PRJ_TO_LLVM"
          python - <<'PY'
          import json
          import os
          import subprocess
          import urllib.error
          import urllib.request

          repository = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GITHUB_TOKEN"]
          expected_sha = os.environ["EXPECTED_SOURCE_SHA"]
          translator_path = "projects/ESP32_PRJ_TO_LLVM"
          current_translator = subprocess.check_output(
              ["git", "-C", translator_path, "rev-parse", "HEAD"], text=True
          ).strip()
          api = f"https://api.github.com/repos/{repository}"

          def get_json(url):
              request = urllib.request.Request(
                  url,
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {token}",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)

          def is_ancestor(source_sha):
              return subprocess.run(
                  ["git", "merge-base", "--is-ancestor", source_sha, expected_sha],
                  check=False,
              ).returncode == 0

          def submodule_sha(source_sha):
              line = subprocess.check_output(
                  ["git", "ls-tree", source_sha, translator_path], text=True
              ).strip()
              fields = line.split()
              return fields[2] if len(fields) >= 3 and fields[0] == "160000" else None

          runs = get_json(
              f"{api}/actions/runs?branch=ESPB_WORK&per_page=100"
          ).get("workflow_runs", [])

          def successful(run, workflow_path):
              return (
                  run.get("path") == workflow_path
                  and run.get("head_branch") == "ESPB_WORK"
                  and run.get("status") == "completed"
                  and run.get("conclusion") == "success"
                  and bool(run.get("head_sha"))
                  and is_ancestor(run["head_sha"])
              )

          def artifact_for(run, name):
              try:
                  artifacts = get_json(run["artifacts_url"]).get("artifacts", [])
              except (KeyError, urllib.error.HTTPError, urllib.error.URLError):
                  return False
              return any(
                  item.get("name") == name and not item.get("expired", False)
                  for item in artifacts
              )

          bitcode_candidates = [
              run for run in runs
              if successful(run, ".github/workflows/build_opcode_groups.yml")
          ]
          bitcode_candidates.sort(
              key=lambda run: run.get("created_at", ""), reverse=True
          )

          selected_bitcode = None
          for run in bitcode_candidates:
              source_sha = run["head_sha"]
              source_diff = subprocess.run(
                  [
                      "git", "diff", "--quiet", source_sha, expected_sha, "--",
                      "tests/bytecode_groups",
                      translator_path,
                  ],
                  check=False,
              )
              if source_diff.returncode != 0:
                  continue
              if artifact_for(run, "espb-opcode-groups-bc"):
                  selected_bitcode = run
                  break

          if selected_bitcode is None:
              print(
                  "::error::No successful bitcode artifact matches the current "
                  "test sources and translator submodule."
              )
              raise SystemExit(1)

          paired_candidates = [
              run for run in runs
              if successful(run, ".github/workflows/build_opcode_groups_espb.yml")
              and submodule_sha(run["head_sha"]) == current_translator
          ]
          paired_candidates.sort(
              key=lambda run: run.get("created_at", ""), reverse=True
          )

          selected_pair = None
          for run in paired_candidates:
              if artifact_for(run, "espb-opcode-groups-paired"):
                  selected_pair = run
                  break

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"run_id={selected_bitcode['id']}\n")
              output.write(f"source_sha={selected_bitcode['head_sha']}\n")
              output.write(
                  f"previous_pair_run_id={selected_pair['id'] if selected_pair else ''}\n"
              )
              output.write(
                  f"previous_pair_source_sha={selected_pair['head_sha'] if selected_pair else ''}\n"
              )

          print(
              f"Selected bitcode run={selected_bitcode['id']} "
              f"source={selected_bitcode['head_sha']}"
          )
          if selected_pair:
              print(
                  f"Selected previous paired run={selected_pair['id']} "
                  f"source={selected_pair['head_sha']}"
              )
          else:
              print("No compatible previous paired artifact; all groups will translate.")
          PY

      - name: Download the already-validated LLVM bitcode corpus
        uses: actions/download-artifact@v4
        with:
          name: espb-opcode-groups-bc
          path: .work/bytecode_groups
          run-id: ${{ steps.bitcode.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download previous paired corpus for content-addressed reuse
        if: steps.bitcode.outputs.previous_pair_run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: espb-opcode-groups-paired
          path: .work/previous
          run-id: ${{ steps.bitcode.outputs.previous_pair_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore unchanged bitcode from previous paired corpus
        if: steps.bitcode.outputs.previous_pair_run_id != ''
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .work/bytecode_groups
          restored=0
          for previous_bc in .work/previous/bytecode_groups/*.bc; do
            [[ -f "$previous_bc" ]] || continue
            current_bc=".work/bytecode_groups/$(basename "$previous_bc")"
            if [[ ! -s "$current_bc" ]]; then
              cp "$previous_bc" "$current_bc"
              restored=$((restored + 1))
            fi
          done
          echo "BITCODE_GROUPS_RESTORED=$restored"

      - name: Reuse unchanged paired modules by bitcode SHA-256
        if: steps.bitcode.outputs.previous_pair_run_id != ''
        shell: bash
        env:
          PREVIOUS_PAIR_RUN_ID: ${{ steps.bitcode.outputs.previous_pair_run_id }}
          PREVIOUS_PAIR_SOURCE_SHA: ${{ steps.bitcode.outputs.previous_pair_source_sha }}
        run: |
          set -euo pipefail
          python .github/scripts/reuse_paired_groups.py \
            --previous-root "$GITHUB_WORKSPACE/.work/previous" \
            --bitcode-dir "$GITHUB_WORKSPACE/.work/bytecode_groups" \
            --paired-dir "$GITHUB_WORKSPACE/.work/paired" \
            --repository "$GITHUB_REPOSITORY" \
            --branch "$GITHUB_REF_NAME" \
            --translator-commit "$(git -C projects/ESP32_PRJ_TO_LLVM rev-parse HEAD)" \
            --expected-run-id "$PREVIOUS_PAIR_RUN_ID" \
            --expected-source-commit "$PREVIOUS_PAIR_SOURCE_SHA"

      - name: Verify the downloaded bitcode set
        shell: bash
        env:
          BITCODE_RUN_ID: ${{ steps.bitcode.outputs.run_id }}
          BITCODE_SOURCE_SHA: ${{ steps.bitcode.outputs.source_sha }}
        run: |
          set -euo pipefail
          test "$(find .work/bytecode_groups -maxdepth 1 -name '*.bc' -type f | wc -l)" -eq 10
          for source in tests/bytecode_groups/*.c; do
            stem="$(basename "$source" .c)"
            test -s ".work/bytecode_groups/$stem.bc"
          done
          echo "ESPB_BITCODE_REUSED_RUN=$BITCODE_RUN_ID"
          echo "ESPB_BITCODE_SOURCE_SHA=$BITCODE_SOURCE_SHA"
          echo "ESPB_BITCODE_GROUPS=10"

      - name: Translate each group once and create matched execution variants
        env:
          ESPB_TRANSLATOR_KEYS: ${{ secrets.ESPB_TRANSLATOR_KEYS }}
          ESPB_API_KEY: ${{ secrets.ESPB_API_KEY }}
          ESPB_API_KEY_1: ${{ secrets.ESPB_API_KEY_1 }}
          ESPB_API_KEY_2: ${{ secrets.ESPB_API_KEY_2 }}
          ESPB_API_KEY_3: ${{ secrets.ESPB_API_KEY_3 }}
          ESPB_API_KEY_4: ${{ secrets.ESPB_API_KEY_4 }}
          ESPB_API_KEY_5: ${{ secrets.ESPB_API_KEY_5 }}
          ESPB_API_KEY_6: ${{ secrets.ESPB_API_KEY_6 }}
          ESPB_API_KEY_7: ${{ secrets.ESPB_API_KEY_7 }}
          ESPB_API_KEY_8: ${{ secrets.ESPB_API_KEY_8 }}
          ESPB_API_KEY_9: ${{ secrets.ESPB_API_KEY_9 }}
          ESPB_API_KEY_10: ${{ secrets.ESPB_API_KEY_10 }}
          ESPB_API_KEY_11: ${{ secrets.ESPB_API_KEY_11 }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .work/paired
          for bitcode in .work/bytecode_groups/*.bc; do
            stem="$(basename "$bitcode" .bc)"
            jit_module=".work/paired/$stem.jit.espb"
            interpreter_module=".work/paired/$stem.interpreter.espb"
            if [[ -s "$jit_module" && -s "$interpreter_module" ]]; then
              echo "TRANSLATION_REUSED group=$stem"
              continue
            fi
            echo "TRANSLATION_REQUIRED group=$stem"
            python .github/scripts/translate_bc.py "$bitcode" "$jit_module"
            test -s "$jit_module"
            python tools/bytecode_groups/make_interpreter_variant.py "$jit_module" "$interpreter_module"
            test -s "$interpreter_module"
          done
          test "$(find .work/paired -maxdepth 1 -name '*.jit.espb' -type f | wc -l)" -eq 10
          test "$(find .work/paired -maxdepth 1 -name '*.interpreter.espb' -type f | wc -l)" -eq 10

      - name: Audit emitted ESPB opcode coverage
        shell: bash
        run: |
          set -euo pipefail
          python tests/host_tools/audit_espb_opcodes.py \
            --paired-dir .work/paired \
            --interpreter-source components/espb/src/espb_interpreter_runtime_oc.c \
            --expected-groups 10 \
            --json-out .work/paired/emitted-opcode-audit.json \
            --markdown-out .work/paired/emitted-opcode-audit.md

      - name: Create provenance manifest
        shell: bash
        run: |
          set -euo pipefail
          python tools/bytecode_groups/corpus_manifest.py create \
            --repo-root "$GITHUB_WORKSPACE" \
            --bitcode-dir "$GITHUB_WORKSPACE/.work/bytecode_groups" \
            --paired-dir "$GITHUB_WORKSPACE/.work/paired" \
            --repository "$GITHUB_REPOSITORY" \
            --branch "$GITHUB_REF_NAME" \
            --run-id "$GITHUB_RUN_ID" \
            --expected-source-commit "$GITHUB_SHA"


      - name: Publish verified paired modules to qemu_seed
        shell: bash
        run: |
          set -euo pipefail
          for jit_module in .work/paired/*.jit.espb; do
            stem="$(basename "$jit_module" .jit.espb)"
            cp "$jit_module" "modules/qemu_seed/$stem.jit.espb"
            cp ".work/paired/$stem.interpreter.espb" "modules/qemu_seed/$stem.interpreter.espb"
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add modules/qemu_seed/*.jit.espb modules/qemu_seed/*.interpreter.espb
          if git diff --cached --quiet; then
            echo "qemu_seed already matches translated paired corpus"
          else
            git commit -m "Update paired qemu_seed modules from verified translator artifact"
            git push origin HEAD:ESPB_WORK
          fi

      - name: Upload paired ESPB modules and provenance
        uses: actions/upload-artifact@v4
        with:
          name: espb-opcode-groups-paired
          path: |
            .work/paired/*.espb
            .work/paired/manifest.json
            .work/paired/emitted-opcode-audit.json
            .work/paired/emitted-opcode-audit.md
            .work/bytecode_groups/*.bc
          if-no-files-found: error
          retention-days: 14

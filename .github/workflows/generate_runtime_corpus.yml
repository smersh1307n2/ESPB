name: Generate ESPB runtime corpus (4 modules)

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: espb-work-module-commit
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v5.4.1
    steps:
      - name: Check translator credentials before build
        env:
          ESPB_TRANSLATOR_KEYS: ${{ secrets.ESPB_TRANSLATOR_KEYS }}
          ESPB_API_KEY: ${{ secrets.ESPB_API_KEY }}
          ESPB_API_KEY_1: ${{ secrets.ESPB_API_KEY_1 }}
          ESPB_API_KEY_2: ${{ secrets.ESPB_API_KEY_2 }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${ESPB_TRANSLATOR_KEYS//[$'\\r\\n' ]/}" && -z "${ESPB_API_KEY}" && -z "${ESPB_API_KEY_1}" && -z "${ESPB_API_KEY_2}" ]]; then
            echo "::error::No translator credentials configured. Add ESPB_TRANSLATOR_KEYS (newline-separated) or ESPB_API_KEY[_1/_2] repository secrets."
            exit 1
          fi

      - name: Checkout ESPB_WORK with project sources
        uses: actions/checkout@v4
        with:
          ref: ESPB_WORK
          submodules: recursive
          fetch-depth: 0

      - name: Install ESP Clang
        shell: bash
        run: |
          python "$IDF_PATH/tools/idf_tools.py" install esp-clang
          CLANG="$(find -L /opt/esp/tools/esp-clang -type f -path "*/bin/clang" -perm -111 -print -quit)"
          test -n "$CLANG"
          echo "$(dirname "$CLANG")" >> "$GITHUB_PATH"
          echo "ESPB_CLANG=$CLANG" >> "$GITHUB_ENV"

      - name: Generate all four LLVM bitcode modules
        shell: bash
        run: |
          set -euo pipefail
          cd projects/ESP32_PRJ_TO_LLVM
          . "$IDF_PATH/export.sh"
          for example in 01_integer 02_control_flow 03_memory 04_calls; do
            python scripts/build_bitcode.py "examples/$example"
          done
          mkdir -p "$GITHUB_WORKSPACE/.work"
          cp llvm_output/01_integer_integer.bc "$GITHUB_WORKSPACE/.work/"
          cp llvm_output/02_control_flow_control_flow.bc "$GITHUB_WORKSPACE/.work/"
          cp llvm_output/03_memory_memory.bc "$GITHUB_WORKSPACE/.work/"
          cp llvm_output/04_calls_calls.bc "$GITHUB_WORKSPACE/.work/"
          test -s "$GITHUB_WORKSPACE/.work/01_integer_integer.bc"
          test -s "$GITHUB_WORKSPACE/.work/02_control_flow_control_flow.bc"
          test -s "$GITHUB_WORKSPACE/.work/03_memory_memory.bc"
          test -s "$GITHUB_WORKSPACE/.work/04_calls_calls.bc"

      - name: Translate all modules (quota-aware key rotation)
        env:
          ESPB_TRANSLATOR_KEYS: ${{ secrets.ESPB_TRANSLATOR_KEYS }}
          ESPB_API_KEY: ${{ secrets.ESPB_API_KEY }}
          ESPB_API_KEY_1: ${{ secrets.ESPB_API_KEY_1 }}
          ESPB_API_KEY_2: ${{ secrets.ESPB_API_KEY_2 }}
        shell: bash
        run: |
          set -euo pipefail
          for name in 01_integer_integer 02_control_flow_control_flow 03_memory_memory 04_calls_calls; do
            python .github/scripts/translate_bc.py ".work/$name.bc" ".work/$name.espb"
            test -s ".work/$name.espb"
          done

      - name: Commit regenerated corpus
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p modules/01_integer modules/02_control_flow modules/03_memory modules/04_calls
          cp .work/01_integer_integer.espb modules/01_integer/
          cp .work/02_control_flow_control_flow.espb modules/02_control_flow/
          cp .work/03_memory_memory.espb modules/03_memory/
          cp .work/04_calls_calls.espb modules/04_calls/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add modules/01_integer/01_integer_integer.espb
          git add modules/02_control_flow/02_control_flow_control_flow.espb
          git add modules/03_memory/03_memory_memory.espb
          git add modules/04_calls/04_calls_calls.espb
          if git diff --cached --quiet; then
            echo "Generated runtime corpus is unchanged."
            exit 0
          fi
          git commit -m "build: regenerate ESPB runtime corpus"
          git push origin HEAD:ESPB_WORK
